name: Ausbildung Verkäufer Daily Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * *"


jobs:

  search:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium
        run: |

          python -m playwright install chromium

          python -m playwright install-deps chromium


      # ======================================================
      # CHECK FILES
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "FICHIERS DU PROJET"
          echo "=========================================="

          ls -la

          echo ""
          echo "=========================================="
          echo "DATA.JSON AVANT SCRAPING"
          echo "=========================================="

          if [ -f data.json ]; then

            cat data.json

          else

            echo "[]"
            echo "[]" > data.json

          fi


      # ======================================================
      # RUN SCRAPER
      # ======================================================

      - name: Run Ausbildung Bot
        env:

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |

          python scraper.py


      # ======================================================
      # CHECK DATABASE
      # ======================================================

      - name: Check database after scraping
        run: |

          echo "=========================================="
          echo "DATA.JSON APRÈS SCRAPING"
          echo "=========================================="

          if [ -f data.json ]; then

            cat data.json

          else

            echo "data.json introuvable"

          fi


      # ======================================================
      # SAVE DATABASE
      # ======================================================

      - name: Save database
        run: |

          git config user.name "Ausbildung Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then

            echo "Aucune modification de data.json."

          else

            git commit \
              -m "Update Ausbildung database"

            git push

          fi
